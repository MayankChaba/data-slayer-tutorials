name: Publish cadence (article drip)

# Server-side article drip. Publishes `per_day * days_since_last_run` articles
# from queue/ into the Astro site's src/content/resources/ collection, then
# builds and deploys. Runs on GitHub's infrastructure, so it is independent of
# the laptop and catches up any missed days. See scripts/drip.py.
#
# Runs daily at 09:30 America/Los_Angeles (16:30 UTC during PDT).
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-cadence
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drip the queue into /resources (with catch-up)
        run: python scripts/drip.py

      - name: Commit + push
        id: commit
        run: |
          git config user.name "dataslayer-drip"
          git config user.email "drip@dataslayer.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish articles to /resources (cadence drip)"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.commit.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.commit.outputs.published == 'true'
        run: npm ci

      - name: Build site
        if: steps.commit.outputs.published == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.published == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dataslayer-hub --branch=main
