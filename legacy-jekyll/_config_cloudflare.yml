# Cloudflare Pages build override — merged over _config.yml by the CI workflow:
#   jekyll build --config _config.yml,_config_cloudflare.yml
#
# The hub moves from https://mayankchaba.github.io/data-slayer-tutorials/
# (GitHub Pages project page) to the domain root at https://dataslayer.dev/
# The old GitHub Pages project site (mayankchaba.github.io/data-slayer-tutorials) is
# retired; this is the only build that serves the hub now.
url: "https://dataslayer.dev"
baseurl: ""

# Keep non-content source out of the built site:
#   functions  — Pages Functions source, compiled and deployed by wrangler.
#   queue      — internal publish queue (queue.json, state.json, staged drafts).
#                Must never be served or indexed: the staged draft at
#                /queue/articles/<slug>/ duplicates the published
#                /use-cases/<slug>/ page and would compete with it in search.
exclude:
  - functions
  - queue
