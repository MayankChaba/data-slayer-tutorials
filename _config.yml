title: Data Slayer Tutorials
tagline: Practical web-scraping & automation recipes
description: >-
  Step-by-step tutorials for scraping and automating LinkedIn, Instagram,
  Facebook, TikTok and X with Apify actors — no login, no proxies to manage.
author: Mayank Chaba
url: "https://mayankchaba.github.io"
baseurl: "/data-slayer-tutorials"
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Analytics & search-console verification — uncomment a key and set its ID to enable.
# google_analytics: "G-XXXXXXXXXX"       # Google Analytics 4 measurement ID
# clarity_project_id: "XXXXXXXX"         # Microsoft Clarity project ID
# google_site_verification: "TOKEN"      # Search Console HTML-tag token (URL-prefix property)
markdown: kramdown
permalink: /tutorials/:title/
header_pages:
  - actors/index.md
  - use-cases/index.md

defaults:
  - scope:
      path: "use-cases"
    values:
      layout: "use-case"
      permalink: "/use-cases/:basename/"
